<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JLPT N4 Renshuu — Latihan Soal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16130e; --cream:#f4ead8; --paper:#fff8ea; --accent:#e0a400;
    --green:#2f9e44; --red:#e03131; --blue:#4dabf7; --violet:#9775fa;
    --shadow:6px 6px 0 var(--ink); --shadow-sm:4px 4px 0 var(--ink);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Archivo','Noto Sans JP',sans-serif; background:var(--cream); color:var(--ink);
    line-height:1.55; padding:18px 14px 90px;
    background-image:radial-gradient(var(--ink) 1px, transparent 1px); background-size:26px 26px;
    background-position:0 0;
  }
  body::before{content:""; position:fixed; inset:0; background:var(--cream); opacity:.94; z-index:-1;}
  .bungkus{max-width:680px; margin:0 auto;}
  .jp{font-family:'Noto Sans JP','Archivo',sans-serif;}
  .tersembunyi{display:none !important;}

  /* ===== Kepala ===== */
  .kepala{
    background:var(--ink); color:var(--cream); border:3px solid var(--ink);
    border-radius:16px; box-shadow:var(--shadow); padding:22px 20px 18px; margin-bottom:22px;
  }
  .kepala .label{
    display:inline-block; background:var(--accent); color:var(--ink); font-weight:800;
    font-size:.72rem; letter-spacing:.14em; padding:4px 10px; border:2px solid var(--cream);
    border-radius:999px; margin-bottom:10px;
  }
  .kepala h1{font-family:'Archivo Black',sans-serif; font-size:2rem; line-height:1.08; letter-spacing:.01em;}
  .kepala h1 .kuning{color:var(--accent);}
  .kepala p{margin-top:8px; font-size:.95rem; opacity:.85; font-weight:500;}

  /* ===== Kartu latihan (menu) ===== */
  .kartu-latihan{
    background:var(--paper); border:3px solid var(--ink); border-radius:16px;
    box-shadow:var(--shadow); padding:18px; margin-bottom:18px;
    display:flex; gap:16px; align-items:stretch;
  }
  .nomor-besar{
    font-family:'Archivo Black',sans-serif; font-size:2rem; background:var(--accent);
    border:3px solid var(--ink); border-radius:12px; min-width:74px;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);
  }
  .isi-latihan{flex:1; min-width:0;}
  .isi-latihan h2{font-family:'Archivo Black',sans-serif; font-size:1.15rem; line-height:1.2;}
  .isi-latihan .meta{font-weight:700; font-size:.85rem; margin-top:2px;}
  .chip-baris{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .chip{
    font-size:.72rem; font-weight:800; border:2px solid var(--ink); border-radius:999px;
    padding:2px 9px; background:var(--cream); white-space:nowrap;
  }
  .chip b{font-family:'Archivo Black',sans-serif;}
  .terbaik{margin-top:10px; font-size:.8rem; font-weight:800;}
  .terbaik .lencana{background:var(--green); color:#fff; border:2px solid var(--ink); border-radius:8px; padding:1px 8px;}
  .btn{
    font-family:'Archivo',sans-serif; font-weight:800; cursor:pointer; color:var(--ink);
    border:3px solid var(--ink); border-radius:12px; background:var(--accent);
    box-shadow:var(--shadow-sm); padding:12px 18px; font-size:1rem; letter-spacing:.02em;
    transition:transform .08s ease, box-shadow .08s ease; user-select:none;
  }
  .btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink);}
  .btn-blok{display:block; width:100%; margin-top:14px; font-size:1.05rem; padding:14px;}
  .btn-putih{background:var(--paper);}
  .btn-hitam{background:var(--ink); color:var(--cream);}
  .btn-hijau{background:var(--green); color:#fff;}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}

  /* ===== Kuis ===== */
  .baris-atas{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
  .btn-kecil{padding:8px 13px; font-size:.85rem; border-radius:10px; box-shadow:3px 3px 0 var(--ink);}
  .btn-kecil:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .info-soal{
    margin-left:auto; font-family:'Archivo Black',sans-serif; font-size:.95rem;
    background:var(--paper); border:3px solid var(--ink); border-radius:10px; padding:6px 12px;
    box-shadow:3px 3px 0 var(--ink);
  }
  .skor-mini{display:flex; gap:8px;}
  .skor-mini span{font-weight:800; font-size:.85rem; border:2.5px solid var(--ink); border-radius:999px; padding:3px 11px;}
  .skor-mini .b{background:#d3f9d8;} .skor-mini .s{background:#ffe3e3;}
  .wadah-progres{
    height:24px; background:var(--paper); border:3px solid var(--ink); border-radius:999px;
    overflow:hidden; box-shadow:var(--shadow-sm); margin-bottom:18px;
  }
  #bilah-progres{height:100%; width:0%; background:var(--accent); transition:width .3s ease;
    background-image:repeating-linear-gradient(-45deg, rgba(0,0,0,.16) 0 12px, transparent 12px 24px);}
  .kartu-soal{
    background:var(--paper); border:3px solid var(--ink); border-radius:16px;
    box-shadow:var(--shadow); padding:20px; margin-bottom:16px;
  }
  .kartu-soal .tipe{
    display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.1em;
    background:var(--blue); border:2px solid var(--ink); border-radius:999px; padding:3px 11px; margin-bottom:12px;
  }
  .teks-soal{font-size:1.28rem; line-height:1.75; font-weight:500;}
  .teks-soal.panjang{font-size:1.05rem; line-height:1.8;}
  .teks-soal .underline{border-bottom:3px solid var(--accent); font-weight:700; padding-bottom:1px;}
  .teks-soal .usage-word{background:var(--accent); border:2px solid var(--ink); border-radius:7px; padding:0 7px; font-weight:700;}
  .pilihan{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .opsi{
    display:flex; align-items:center; gap:13px; text-align:left; width:100%;
    background:var(--paper); border:3px solid var(--ink); border-radius:13px;
    box-shadow:4px 4px 0 var(--ink); padding:13px 15px; cursor:pointer;
    font-family:'Noto Sans JP','Archivo',sans-serif; font-size:1.12rem; font-weight:500; color:var(--ink);
    transition:transform .08s ease, box-shadow .08s ease, background .12s ease;
  }
  .opsi:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .opsi .huruf{
    font-family:'Archivo Black',sans-serif; font-size:.95rem; background:var(--cream);
    border:2.5px solid var(--ink); border-radius:9px; min-width:36px; height:36px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .opsi.benar{background:var(--green); color:#fff;}
  .opsi.benar .huruf{background:#fff; color:var(--ink);}
  .opsi.salah{background:var(--red); color:#fff;}
  .opsi.salah .huruf{background:#fff; color:var(--ink);}
  .opsi.redup{opacity:.45;}
  .opsi:disabled{cursor:default;}
  .kartu-bahas{
    background:#fff3bf; border:3px solid var(--ink); border-radius:16px;
    box-shadow:var(--shadow); padding:17px 19px; margin-bottom:16px;
  }
  .kartu-bahas .label{font-family:'Archivo Black',sans-serif; font-size:.8rem; letter-spacing:.1em; margin-bottom:6px;}
  .kartu-bahas .isi{font-size:.98rem; line-height:1.65;}
  .kartu-bahas .isi code, .ulasan code{background:var(--paper); border:1.5px solid var(--ink); border-radius:5px; padding:0 5px; font-family:'Noto Sans JP',sans-serif;}
  .navigasi-bawah{position:sticky; bottom:14px; z-index:5;}

  /* ===== Hasil ===== */
  .kartu-skor{
    background:var(--ink); color:var(--cream); border:3px solid var(--ink); border-radius:16px;
    box-shadow:var(--shadow); padding:24px 20px; text-align:center; margin-bottom:18px;
  }
  .kartu-skor .persen{font-family:'Archivo Black',sans-serif; font-size:3.4rem; color:var(--accent); line-height:1;}
  .kartu-skor .rincian{font-weight:800; margin-top:8px; font-size:1.05rem;}
  .kartu-skor .pesan{margin-top:6px; opacity:.85; font-weight:500;}
  .kartu-putih{background:var(--paper); border:3px solid var(--ink); border-radius:16px; box-shadow:var(--shadow); padding:19px; margin-bottom:18px;}
  .kartu-putih h3{font-family:'Archivo Black',sans-serif; font-size:1rem; letter-spacing:.03em; margin-bottom:13px;}
  .baris-kat{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:.88rem; font-weight:700;}
  .baris-kat .nama{width:128px; flex-shrink:0;}
  .baris-kat .rel{flex:1; height:15px; border:2.5px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--cream);}
  .baris-kat .isi-rel{height:100%; background:var(--green);}
  .baris-kat .angka{width:52px; text-align:right; font-family:'Archivo Black',sans-serif; font-size:.82rem;}
  .ulasan{border:3px solid var(--ink); border-radius:13px; padding:14px 15px; margin-bottom:12px; background:#fff;}
  .ulasan .t{font-size:1rem; line-height:1.65; margin-bottom:8px;}
  .ulasan .t .underline{border-bottom:3px solid var(--accent); font-weight:700;}
  .ulasan .t .usage-word{background:var(--accent); border:2px solid var(--ink); border-radius:7px; padding:0 6px; font-weight:700;}
  .ulasan .jwb{font-size:.9rem; font-weight:700; margin-bottom:3px;}
  .ulasan .jwb .s{color:var(--red);} .ulasan .jwb .b{color:var(--green);}
  .ulasan .bahas{font-size:.88rem; margin-top:7px; background:#fff3bf; border:2px solid var(--ink); border-radius:9px; padding:8px 11px; line-height:1.6;}
  .kaki-teks{text-align:center; font-size:.8rem; font-weight:700; opacity:.65; margin-top:26px;}
  @media (max-width:520px){
    .kepala h1{font-size:1.6rem;}
    .kartu-latihan{flex-direction:column;}
    .nomor-besar{min-height:58px;}
    .teks-soal{font-size:1.18rem;}
    .baris-kat .nama{width:104px;}
  }
</style>
</head>
<body>
<div class="bungkus">

  <!-- ===== MENU ===== -->
  <section id="layar-menu">
    <div class="kepala">
      <span class="label">JLPT N4 · 日本語能力試験</span>
      <h1>RENSHUU<br><span class="kuning">練習 soal N4</span></h1>
      <p>274 soal dari 5 set ujian asli. Satu soal per layar, langsung dibahas. Ganbatte!</p>
    </div>
    <div id="daftar-latihan"></div>
    <p class="kaki-teks">Skor terbaikmu tersimpan di perangkat ini.</p>
  </section>

  <!-- ===== KUIS ===== -->
  <section id="layar-kuis" class="tersembunyi">
    <div class="baris-atas">
      <button class="btn btn-putih btn-kecil" id="btn-menu-kuis">← Menu</button>
      <div class="skor-mini">
        <span class="b">✓ <span id="skor-benar">0</span></span>
        <span class="s">✗ <span id="skor-salah">0</span></span>
      </div>
      <div class="info-soal" id="info-soal">Soal 1 / 55</div>
    </div>
    <div class="wadah-progres"><div id="bilah-progres"></div></div>
    <div class="kartu-soal">
      <span class="tipe" id="tipe-soal">Hiragana</span>
      <div class="teks-soal jp" id="teks-soal"></div>
    </div>
    <div class="pilihan" id="wadah-opsi"></div>
    <div class="kartu-bahas tersembunyi" id="kartu-bahas">
      <div class="label" id="label-bahas">✓ BENAR!</div>
      <div class="isi" id="isi-bahas"></div>
    </div>
    <div class="navigasi-bawah">
      <button class="btn btn-blok tersembunyi" id="btn-lanjut">Soal Berikutnya →</button>
    </div>
  </section>

  <!-- ===== HASIL ===== -->
  <section id="layar-hasil" class="tersembunyi">
    <div class="kartu-skor">
      <div class="persen" id="hasil-persen">0%</div>
      <div class="rincian" id="hasil-rincian">Benar 0 dari 0 soal</div>
      <div class="pesan" id="hasil-pesan"></div>
    </div>
    <div class="kartu-putih">
      <h3>PER KATEGORI</h3>
      <div id="hasil-kategori"></div>
    </div>
    <div class="kartu-putih" id="wadah-ulasan">
      <h3>ULASAN SOAL YANG SALAH (<span id="jumlah-salah">0</span>)</h3>
      <div id="daftar-ulasan"></div>
    </div>
    <button class="btn btn-hijau btn-blok" id="btn-ulangi-salah">Ulangi yang Salah Saja</button>
    <button class="btn btn-blok" id="btn-ulangi">Ulangi Latihan Ini</button>
    <button class="btn btn-putih btn-blok" id="btn-menu-hasil">Menu Utama</button>
  </section>

</div>

<script>
"use strict";
const BANK = {"1":[{"type":"Hiragana","question":"きょうはとても<span class='underline'>楽しかった</span>です。","options":["うれしかった","いそがしかった","はずかしかった","たのしかった"],"correctAnswer":"たのしかった","explanation":"Kanji `楽しい` (たのしい) dibaca 'tanoshii' yang berarti menyenangkan."},{"type":"Hiragana","question":"たなかさんはいつから<span class='underline'>習っている</span>んですか。","options":["かよって","まって","ならって","のこって"],"correctAnswer":"ならって","explanation":"Kanji `習う` (ならう) dibaca 'narau' yang berarti belajar."},{"type":"Hiragana","question":"このパソコンは<span class='underline'>軽い</span>ですね。","options":["かるい","おもい","はやい","おそい"],"correctAnswer":"かるい","explanation":"Kanji `軽い` (かるい) dibaca 'karui' yang berarti ringan."},{"type":"Hiragana","question":"このスーパーは <span class='underline'>食料品</span>が安いです。","options":["しょくりゅうひん","しょくりょうひん","しゅくりょうひん","しゅくりゅうひん"],"correctAnswer":"しょくりょうひん","explanation":"Kanji `食料品` dibaca 'shokuryouhin' yang berarti bahan makanan."},{"type":"Hiragana","question":"<span class='underline'>顔</span>に何かついていますよ。","options":["くつ","あたま","ふく","かお"],"correctAnswer":"かお","explanation":"Kanji `顔` (かお) dibaca 'kao' yang berarti wajah."},{"type":"Hiragana","question":"けさは天気<span class='underline'>予報</span>を見ませんでした。","options":["よほう","ようほう","ようぼう","よぼう"],"correctAnswer":"よほう","explanation":"Kanji `予報` dibaca 'yohou' yang berarti ramalan."},{"type":"Hiragana","question":"やまもとさん、<span class='underline'>動かないで</span>ください。","options":["あるかないで","うごかないで","なかないで","はたらかないで"],"correctAnswer":"うごかないで","explanation":"Kanji `動く` (うごく) dibaca 'ugoku' yang berarti bergerak."},{"type":"Hiragana","question":"うちでは子どもが犬の<span class='underline'>世話</span>をします。","options":["せいわ","せわ","せはなし","せいはなし"],"correctAnswer":"せわ","explanation":"Kanji `世話` dibaca 'sewa' yang berarti merawat/mengurus."},{"type":"Hiragana","question":"もうすぐ <span class='underline'>特急</span>電車が来ます。","options":["とっきゅ","ときゅう","とっきゅう","ときゅ"],"correctAnswer":"とっきゅう","explanation":"Kanji `特急` dibaca 'tokkyuu' yang berarti kereta ekspres. Terjadi perubahan bunyi (sokuon)."},{"type":"Kanji","question":"その<span class='underline'>えいが</span>は おもしろかったですよ。","options":["映面","央画","映画","央面"],"correctAnswer":"映画","explanation":"Kata 'eiga' (film) ditulis dengan kanji `映画`."},{"type":"Kanji","question":"魚がたくさん<span class='underline'>およいで</span>います。","options":["海いで","泳いで","港いで","注いで"],"correctAnswer":"泳いで","explanation":"Kata 'oyoide' (dari 'oyogu', berenang) ditulis dengan kanji `泳いで`."},{"type":"Kanji","question":"おもちゃ<span class='underline'>うりば</span>はどこですか。","options":["売り場","売り所","完り場","完り所"],"correctAnswer":"売り場","explanation":"Kata 'uriba' (tempat penjualan) ditulis dengan kanji `売り場`."},{"type":"Kanji","question":"コンサートは4時に<span class='underline'>おわります</span>。","options":["関わります","始わります","閉わります","終わります"],"correctAnswer":"終わります","explanation":"Kata 'owarimasu' (selesai) ditulis dengan kanji `終わります`."},{"type":"Kanji","question":"このあたりに<span class='underline'>ほんや</span>はありますか。","options":["本室","本店","本屋","本家"],"correctAnswer":"本屋","explanation":"Kata 'hon-ya' (toko buku) ditulis dengan kanji `本屋`."},{"type":"Kanji","question":"<span class='underline'>かかり</span>の人に聞いてみましょう。","options":["糸り","係り","員り","損り"],"correctAnswer":"係り","explanation":"Kata 'kakari' (petugas/penanggung jawab) ditulis dengan kanji `係り`."},{"type":"Kosakata-Isi","question":"二つめのえきで電車からバスに( )ください。","options":["おりて","のりかえて","ひっこして","でて"],"correctAnswer":"のりかえて","explanation":"`のりかえて` (norikaete) berarti 'bertukar kendaraan'. Kalimat ini meminta untuk bertukar dari kereta ke bus."},{"type":"Kosakata-Isi","question":"あのレストランの( )には、英語のせつめいも書いてあります。","options":["サービス","チップ","アルバイト","メニュー"],"correctAnswer":"メニュー","explanation":"`メニュー` (menyuu) berarti 'menu'. Di menu tersebut ada penjelasan dalam bahasa Inggris."},{"type":"Kosakata-Isi","question":"先月 大学を( )して、今は日本でしごとをしています。","options":["ふくしゅう","きょういく","けんきゅう","そつぎょう"],"correctAnswer":"そつぎょう","explanation":"`そつぎょう` (sotsugyou) berarti 'lulus'. Kalimat berarti 'Bulan lalu saya lulus universitas.'"},{"type":"Kosakata-Isi","question":"このみちは( )をしているので、とおれません。","options":["こしょう","こうじ","はんたい","しっぱい"],"correctAnswer":"こうじ","explanation":"`こうじ` (kouji) berarti 'konstruksi'. Jalan tidak bisa dilewati karena ada pengerjaan konstruksi."},{"type":"Kosakata-Isi","question":"きょう、( )を1まいわってしまいました。","options":["タオル","ふくろ","さら","ポスター"],"correctAnswer":"さら","explanation":"`さら` (sara) berarti 'piring'. Kalimat berarti 'Hari ini saya memecahkan sebuah piring.'"},{"type":"Kosakata-Isi","question":"日本語がただしいかどうか、もういちど ( )してください。","options":["チェック","コピー","スタート","サイン"],"correctAnswer":"チェック","explanation":"`チェック` (chekku) berarti 'memeriksa'. Kalimat meminta untuk memeriksa kembali bahasa Jepangnya."},{"type":"Kosakata-Isi","question":"どこにりょこうに行くか、クラスのみんなに( )を聞いて、きめました。","options":["そうだん","さんせい","しつもん","いけん"],"correctAnswer":"いけん","explanation":"`いけん` (iken) berarti 'pendapat'. Keputusan dibuat setelah mendengar pendapat teman sekelas."},{"type":"Kosakata-Isi","question":"国からりょうしんが来るので、くうこうへ ( )に行きます。","options":["むかえ","さそい","あんない","じゅんび"],"correctAnswer":"むかえ","explanation":"`むかえ` (mukae) berarti 'menjemput'. Pergi ke bandara untuk menjemput orang tua."},{"type":"Kosakata-Isi","question":"このにくはかたいので、よく ( ) たべてください。","options":["かんで","こわして","ふんで","おして"],"correctAnswer":"かんで","explanation":"`かんで` (kande) dari `かむ` (kamu) berarti 'mengunyah'. Daging yang keras harus dikunyah dengan baik."},{"type":"Kosakata-Isi","question":"きょうはパーティーがあるので、テーブルに花を( )。","options":["かけました","おくりました","かざりました","たてました"],"correctAnswer":"かざりました","explanation":"`かざりました` (kazarimashita) dari `かざる` (kazaru) berarti 'menghias'. Meja dihias dengan bunga untuk pesta."},{"type":"Kosakata-Sinonim","question":"Kalimat 'これはとても<span class='underline'>だいじ</span>です。' memiliki arti yang sama dengan...","options":["これはとてもゆうめいです。","これはとてもたいせつです。","これはとてもぺんりです。","これはとてもじょうぶです。"],"correctAnswer":"これはとてもたいせつです。","explanation":"`だいじ` (daiji) dan `たいせつ` (taisetsu) keduanya berarti 'penting'."},{"type":"Kosakata-Sinonim","question":"Tanda '<span class='underline'>きんえん</span>です。' memiliki arti yang sama dengan...","options":["ここで右にまがってはいけません。","ここでしゃしんをとってはいけません。","ここでのみものを飲んではいけません。","ここでたばこをすってはいけません。"],"correctAnswer":"ここでたばこをすってはいけません。","explanation":"`きんえん` (kin-en) berarti 'dilarang merokok', yang sama artinya dengan `たばこをすってはいけません` (tidak boleh merokok)."},{"type":"Kosakata-Sinonim","question":"Kalimat 'きのう父に<span class='underline'>しかられました</span>。' memiliki arti yang sama dengan...","options":["きのう父にわらわれました。","きのう父にほめられました。","きのう父にたのまれました。","きのう父におこられました。"],"correctAnswer":"きのう父におこられました。","explanation":"`しかられました` (shikararemashita) dan `おこられました` (okoraremashita) keduanya adalah bentuk pasif yang berarti 'dimarahi'."},{"type":"Kosakata-Sinonim","question":"Kalimat 'あしたの9時にそちらに<span class='underline'>とどけます</span>。' memiliki arti yang sama dengan...","options":["あしたの9時にそちらにもっていきます。","あしたの9時にそちらにかえします。","あしたの9時にそちらにつきます。","あしたの9時にそちらにかえります。"],"correctAnswer":"あしたの9時にそちらにもっていきます。","explanation":"`とどけます` (todokemasu) berarti 'mengantarkan'. Arti ini paling dekat dengan `もっていきます` (motte ikimasu) yang berarti 'membawa pergi (ke sana)'."},{"type":"Kosakata-Sinonim","question":"Kalimat 'ここは車を<span class='underline'>せいさんする</span>ところです。' memiliki arti yang sama dengan...","options":["ここは車をかりるところです。","ここは車をとめるところです。","ここは車をつくるところです。","ここは車をあらうところです。"],"correctAnswer":"ここは車をつくるところです。","explanation":"`せいさんする` (seisan suru) berarti 'memproduksi', yang bersinonim dengan `つくる` (tsukuru) yang berarti 'membuat'."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>やくそく</span>' yang paling tepat.","options":["このひこうきは 10時に日本につくやくそくです。","あしたは、母とかいものに行く やくそくがあります。","電車のきっぷのやくそくはインターネットでできますか。","今から、きょうの見学のやくそくをせつめいします。"],"correctAnswer":"あしたは、母とかいものに行く やくそくがあります。","explanation":"`やくそく` (yakusoku) berarti 'janji' antar orang. Pilihan 2 ('Saya punya janji pergi belanja dengan ibu') adalah penggunaan yang benar."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>おれい</span>' yang paling tepat.","options":["おみやげをもらったので、おれいを言いました。","にゅういんしたとき、友だちがおれいに来てくれました。","きょうは父のたんじょうびのおれいを買いに行きます。","「しつれいします」と言って、おれいをしてからへやに入ります。"],"correctAnswer":"おみやげをもらったので、おれいを言いました。","explanation":"`おれい` (orei) berarti 'ucapan terima kasih'. Pilihan 1 ('Karena dapat oleh-oleh, saya mengucapkan terima kasih') adalah penggunaan yang benar."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>ていねい</span>' yang paling tepat.","options":["デパートや ホテルの人はていねいなことばをつかいます。","父のたんじょうびにていねいな レストランに行きました。","女の人に年を聞くのはていねいではありません。","このおかしは あじがとてもていねいですね。"],"correctAnswer":"デパートや ホテルの人はていねいなことばをつかいます。","explanation":"`ていねい` (teinei) berarti 'sopan' atau 'teliti'. Pilihan 1 ('menggunakan bahasa yang sopan') adalah penggunaan yang paling tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>ぬれる</span>' yang paling tepat.","options":["チョコレートで手がぬれてしまいました。","もりの中の空気はいつもぬれています。","雨で せんたくものがぬれてしまいました。","このメロンはぬれていて、おいしいですね。"],"correctAnswer":"雨で せんたくものがぬれてしまいました。","explanation":"`ぬれる` (nureru) berarti 'menjadi basah' karena cairan seperti air. Pilihan 3 ('cucian menjadi basah karena hujan') adalah penggunaan yang paling tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>わかす</span>' yang paling tepat.","options":["はしる前に、少しうんどうをして、からだをわかしました。","わかしたたまごを半分にして、サラダに入れました。","さむいので、ストープでへやをわかしましょう。","おちゃを入れるから、おゆをわかしてください。"],"correctAnswer":"おちゃを入れるから、おゆをわかしてください。","explanation":"`わかす` (wakasu) berarti 'mendidihkan' cairan, terutama air. Pilihan 4 ('tolong didihkan air panas') adalah penggunaan yang paling tepat."},{"type":"Grammar-Isi","question":"このレストランでは、料理( ) 使う野菜を庭で育てています。","options":["は","に","や","の"],"correctAnswer":"に","explanation":"Partikel `に` digunakan untuk menunjukkan tujuan/kegunaan. `料理に使う` berarti 'digunakan untuk masakan'."},{"type":"Grammar-Isi","question":"(ケーキ屋で)客「すみません。いちごのケーキと、チョコレートのケーキを二つ( )ください。」","options":["と","が","ずつ","など"],"correctAnswer":"ずつ","explanation":"`ずつ` (zutsu) digunakan setelah kata bilangan yang berarti 'masing-masing'. Kalimat berarti 'masing-masing dua'."},{"type":"Grammar-Isi","question":"きのう ( ) 違って、今日はいい天気です。","options":["と","の","に","まで"],"correctAnswer":"と","explanation":"Pola `～と違って` (to chigatte) berarti 'berbeda dengan...'. Kalimat ini membandingkan cuaca hari ini dengan kemarin."},{"type":"Grammar-Isi","question":"A「このカレーはからいですね。」B「えっ?そうですか。私( ) からくないですよ。」","options":["では","には","と"," "],"correctAnswer":"には","explanation":"`には` (ni wa) digunakan untuk menyatakan sudut pandang atau standar perbandingan, 'bagi saya'."},{"type":"Grammar-Isi","question":"A「台所からいいにおい ( ) しますね。」B「クッキーを焼いているんです。」","options":["で","に","を","が"],"correctAnswer":"が","explanation":"Pola `～がします` digunakan untuk indra (bau, suara, rasa). `においがします` berarti 'tercium bau'."},{"type":"Grammar-Isi","question":"インターネットを使えば、( ) 買い物ができて、便利です。","options":["いつでも","いつまで","どこから","どこにも"],"correctAnswer":"いつでも","explanation":"`いつでも` (itsudemo) berarti 'kapan saja'."},{"type":"Grammar-Isi","question":"明日から三日間 京都へ行く予定だが、泊まるホテルが ( ) 決まっていない。","options":["もう","まだ","そろそろ","もうすぐ"],"correctAnswer":"まだ","explanation":"`まだ～ていない` (mada...teinai) berarti 'belum...'. Hotelnya belum diputuskan."},{"type":"Grammar-Isi","question":"森「はい、( ) 元気になりました。」","options":["よく","あまり","すっかり","かならず"],"correctAnswer":"すっかり","explanation":"`すっかり` (sukkari) berarti 'sepenuhnya' atau 'total'. 'Sudah sepenuhnya sehat.'"},{"type":"Grammar-Isi","question":"この神社の祭りは、長い間村の人たち ( ) 続けられている。","options":["から","より","によって","について"],"correctAnswer":"によって","explanation":"`によって` (ni yotte) dalam kalimat pasif menunjukkan pelaku tindakan. 'Dilanjutkan oleh penduduk desa.'"},{"type":"Grammar-Isi","question":"入学式の間、子どもたちは先生の話を( ) 聞いていました。","options":["熱心","熱心な","熱心で","熱心に"],"correctAnswer":"熱心に","explanation":"Kata sifat-na (`熱心な`) yang menerangkan kata kerja (`聞く`) diubah menjadi bentuk `に`. 'Mendengarkan dengan antusias.'"},{"type":"Grammar-Isi","question":"私は来年の夏、富士山に( )つもりです。","options":["のぼる","のぼった","のぼろう","のぼりたい"],"correctAnswer":"のぼる","explanation":"Pola `～つもりです` (bermaksud untuk) didahului oleh kata kerja bentuk kamus."},{"type":"Grammar-Isi","question":"(駅で)客「あのう、このさいふが落ちて( )。」","options":["いました","しました","みました","おきました"],"correctAnswer":"いました","explanation":"`～ています` digunakan untuk menyatakan keadaan/hasil dari suatu aksi yang masih berlangsung. 'Dompetnya (dalam keadaan) terjatuh.'"},{"type":"Grammar-Isi","question":"朝、私はいつも バナナしか( )。","options":["食べます","食べません","食べることができます","食べるかもしれません"],"correctAnswer":"食べません","explanation":"Pola `しか` (hanya) selalu diikuti oleh bentuk negatif. `バナナしか食べません` berarti 'hanya makan pisang'."},{"type":"Grammar-Isi","question":"山下「いいですね。森さんは花が好きだから、きっと( )。」","options":["よろこぶそうです","よろこんだんです","よろこぶでしょう","よろこんだようです"],"correctAnswer":"よろこぶでしょう","explanation":"`でしょう` digunakan untuk menyatakan dugaan/perkiraan yang cukup yakin. 'Pasti akan senang.'"},{"type":"Grammar-Isi","question":"B「わかりました。出発まで時間はありますから、( )よ。」","options":["急がなくなります","急がなければなりません","急いだほうがいいです","急がなくてもいいです"],"correctAnswer":"急がなくてもいいです","explanation":"`～なくてもいいです` (nakutemo ii desu) berarti 'tidak perlu...'. 'Tidak perlu terburu-buru.'"},{"type":"Grammar-Urutan","question":"山下「いいえ、わかりません。___ ___ ★ ___ に聞きましょう。」<br>Pilih kata yang tepat untuk posisi ★.","options":["で","だれ","駅","か"],"correctAnswer":"だれ","explanation":"Urutan yang benar: 駅(3)で(1)だれ(2)★か(4)に聞きましょう。(Mari bertanya pada seseorang di stasiun). Kata di posisi ★ adalah `だれ`."},{"type":"Grammar-Urutan","question":"最近、仕事がいそがしくて、___ ★ ___ ___ 日が多い。<br>Pilih kata yang tepat untuk posisi ★.","options":["帰る","なる","遅く","のが"],"correctAnswer":"遅く","explanation":"Urutan yang benar: 帰る(1)のが(4)遅く(3)★なる(2)日が多い。(Hari-hari di mana saya pulang terlambat semakin banyak). Kata di posisi ★ adalah `遅く`."},{"type":"Grammar-Urutan","question":"両親といっしょに___ ___ ★ ___ 貯金しています。<br>Pilih kata yang tepat untuk posisi ★.","options":["ために","家を","住める","建てる"],"correctAnswer":"建てる","explanation":"Urutan yang benar: 住める(3)家を(2)建てる(4)★ために(1)貯金しています。(Saya menabung untuk membangun rumah yang bisa ditinggali bersama orang tua). Kata di posisi ★ adalah `建てる`."},{"type":"Grammar-Urutan","question":"明日は朝早く出かけない___ ★ ___ ___ かどうか心配です。<br>Pilih kata yang tepat untuk posisi ★.","options":["が","と","早起きできる","いけないのです"],"correctAnswer":"が","explanation":"Urutan yang benar: と(2)いけないのです(4)が(1)★早起きできる(3)かどうか心配です。(Besok harus berangkat pagi, tapi saya khawatir apakah bisa bangun pagi). Kata di posisi ★ adalah `が`."},{"type":"Grammar-Urutan","question":"きのう パーティーで丸い___ ___ ★ ___ くだものを食べました。<br>Pilih kata yang tepat untuk posisi ★.","options":["あまい","の","赤くて","形"],"correctAnswer":"赤くて","explanation":"Urutan yang benar: 形(4)の(2)赤くて(3)★あまい(1)くだものを食べました。(Saya makan buah yang bentuknya bulat, berwarna merah, dan manis). Kata di posisi ★ adalah `赤くて`."}],"2":[{"type":"Hiragana","question":"今日はとても<span class='underline'>楽しかった</span>ですね。","options":["いそがしかった","はげしかった","たのしかった","かなしかった"],"correctAnswer":"たのしかった","explanation":"Kanji `楽しい` (たのしい) dibaca 'tanoshii' yang berarti menyenangkan."},{"type":"Hiragana","question":"わたしはこの<span class='underline'>味</span>がすきです。","options":["かたち","いろ","におい","あじ"],"correctAnswer":"あじ","explanation":"Kanji `味` (あじ) dibaca 'aji' yang berarti rasa."},{"type":"Hiragana","question":"このあたりはちょっと<span class='underline'>不便</span>ですね。","options":["ふべん","ぶべん","ふへん","ぶへん"],"correctAnswer":"ふべん","explanation":"Kanji `不便` dibaca 'fuben' yang berarti tidak praktis."},{"type":"Hiragana","question":"やさいを<span class='underline'>切って</span>ください。","options":["とって","きって","あらって","もって"],"correctAnswer":"きって","explanation":"Kanji `切る` (きる) dalam bentuk -te menjadi `切って` (kitte), yang berarti memotong."},{"type":"Hiragana","question":"はやしさん<span class='underline'>以外</span>はみんな来ました。","options":["にそと","にがい","いそと","いがい"],"correctAnswer":"いがい","explanation":"Kanji `以外` dibaca 'igai' yang berarti selain/kecuali."},{"type":"Hiragana","question":"まどから ずっと<span class='underline'>雲</span>を見ていました。","options":["ほし","ゆき","くも","そら"],"correctAnswer":"くも","explanation":"Kanji `雲` (くも) dibaca 'kumo' yang berarti awan."},{"type":"Hiragana","question":"その電車は<span class='underline'>急行</span>ですよ。","options":["きゅこ","きゅこう","きゅうこ","きゅうこう"],"correctAnswer":"きゅうこう","explanation":"Kanji `急行` dibaca 'kyuukou' yang berarti kereta ekspres (cepat)."},{"type":"Hiragana","question":"これは<span class='underline'>写さないで</span>ください。","options":["おさないで","うつさないで","けさないで","おとさないで"],"correctAnswer":"うつさないで","explanation":"Kanji `写す` (うつす) dibaca 'utsusu' yang berarti menyalin."},{"type":"Hiragana","question":"そのいけんには<span class='underline'>反対</span>です。","options":["はんたい","ほんたい","はんだい","ほんだい"],"correctAnswer":"はんたい","explanation":"Kanji `反対` dibaca 'hantai' yang berarti tidak setuju."},{"type":"Kanji","question":"<span class='underline'>くろい</span> くつしたがほしいです。","options":["白い","黒い","赤い","青い"],"correctAnswer":"黒い","explanation":"`くろい` (kuroi - hitam) ditulis dengan kanji `黒い`."},{"type":"Kanji","question":"なつやすみの<span class='underline'>けいかく</span>はまだきまっていません。","options":["計書","書","計画","訂書"],"correctAnswer":"計画","explanation":"`けいかく` (keikaku - rencana) ditulis dengan kanji `計画`."},{"type":"Kanji","question":"わたしは<span class='underline'>いしゃ</span>になりたいです。","options":["匠員","医員","匠者","医者"],"correctAnswer":"医者","explanation":"`いしゃ` (isha - dokter) ditulis dengan kanji `医者`."},{"type":"Kanji","question":"あしたの<span class='underline'>よる</span> かぞくと出かけます。","options":["夜","昼","タ","朝"],"correctAnswer":"夜","explanation":"`よる` (yoru - malam) ditulis dengan kanji `夜`."},{"type":"Kanji","question":"かさを<span class='underline'>かして</span>ください。","options":["貸して","資して","貸して","質して"],"correctAnswer":"貸して","explanation":"`かして` (kashite - meminjamkan) ditulis dengan kanji `貸して`."},{"type":"Kanji","question":"あしたはサッカーの<span class='underline'>しあい</span>があります。","options":["誠会","誠合","試会","試合"],"correctAnswer":"試合","explanation":"`しあい` (shiai - pertandingan) ditulis dengan kanji `試合`."},{"type":"Kosakata-Isi","question":"さとうさんがけがをしたと聞いて、みんな ( )しました。","options":["しんぱい","けいけん","しつれい","おじぎ"],"correctAnswer":"しんぱい","explanation":"`しんぱい` (shinpai) berarti khawatir."},{"type":"Kosakata-Isi","question":"わたしには、しょうらいかしゅになるという( )があります。","options":["けしき","ゆめ","おもいで","せわ"],"correctAnswer":"ゆめ","explanation":"`ゆめ` (yume) berarti mimpi/cita-cita."},{"type":"Kosakata-Isi","question":"リーさんもこんどのパーティーに ( ) 来てくださいね。","options":["ひじょうに","ぜひ","じゅうぶん","いつも"],"correctAnswer":"ぜひ","explanation":"`ぜひ` (zehi) digunakan untuk menekankan undangan."},{"type":"Kosakata-Isi","question":"これから きかいのつかいかたを( )しますから、よく聞いてください。","options":["じゅんび","りよう","せつめい","せいさん"],"correctAnswer":"せつめい","explanation":"`せつめい` (setsumei) berarti penjelasan."},{"type":"Kosakata-Isi","question":"はがわるいので、( ) ものは食べられません。","options":["きびしい","かたい","はやい","ふかい"],"correctAnswer":"かたい","explanation":"`かたい` (katai) berarti keras."},{"type":"Kosakata-Isi","question":"もりさんをデートに ( )が、行けないと言われました。","options":["さそいました","つたえました","あんないしました","しょうかいしました"],"correctAnswer":"さそいました","explanation":"`さそいました` (sasoimashita) berarti mengajak."},{"type":"Kosakata-Isi","question":"わたしのむすこは、1年で5 ( ) くらいせが高くなりました。","options":["グラム","ばん","けん","センチ"],"correctAnswer":"センチ","explanation":"`センチ` (senchi) adalah sentimeter."},{"type":"Kosakata-Isi","question":"お店で 3だいのパソコンを ( )、いちばん かるい パソコンをえらびました。","options":["かたづけて","かぞえて","くらべて","はらって"],"correctAnswer":"くらべて","explanation":"`くらべて` (kurabete) berarti membandingkan."},{"type":"Kosakata-Isi","question":"たなかさんのいえの電気がついていませんね。たなかさんは( )のようです。","options":["うそ","じゆう","ちゅうし","るす"],"correctAnswer":"るす","explanation":"`るす` (rusu) berarti tidak di rumah."},{"type":"Kosakata-Isi","question":"ヘやの かぎをさがしていますが、まだ( )。","options":["見つかりません","つかまえません","しりません","わりません"],"correctAnswer":"見つかりません","explanation":"`見つかりません` (mitsukarimasen) berarti tidak ditemukan."},{"type":"Kosakata-Sinonim","question":"<u>おとうとはあのきっさてんでアルバイトをしています。</u>","options":["...まっています。","...はたらいています。","...コーヒーを飲んでいます。","...友だちと話しています。"],"correctAnswer":"...はたらいています。","explanation":"`アルバイトをしています` (bekerja paruh waktu) sama artinya dengan `はたらいています` (bekerja)."},{"type":"Kosakata-Sinonim","question":"<u>わたしは すいえいがすきです。</u>","options":["...はしるのがすきです。","...およぐのがすきです。","...ごはんを食べるのがすきです。","...本を読むのがすきです。"],"correctAnswer":"...およぐのがすきです。","explanation":"`すいえい` (berenang, kata benda) memiliki makna inti yang sama dengan `およぐ` (berenang, kata kerja)."},{"type":"Kosakata-Sinonim","question":"<u>それを聞いてびっくりしました。</u>","options":["...わらいました。","...こまりました。","...おこりました。","...おどろきました。"],"correctAnswer":"...おどろきました。","explanation":"`びっくりしました` (terkejut) bersinonim dengan `おどろきました` (terkejut)."},{"type":"Kosakata-Sinonim","question":"<u>あの人はうつくしいですね。</u>","options":["あの人はきれいですね。","あの人は元気ですね。","あの人はおもしろいですね。","あの人はわかいですね。"],"correctAnswer":"あの人はきれいですね。","explanation":"`うつくしい` (cantik/indah) bersinonim dengan `きれい` (cantik/bersih)."},{"type":"Kosakata-Sinonim","question":"<u>この国はこめを ゆにゅうしています。</u>","options":["...ほかの国にうっています。","...ほかの国からもらっています。","...ほかの国から買っています。","...ほかの国にあげています。"],"correctAnswer":"...ほかの国から買っています。","explanation":"`ゆにゅうしています` (mengimpor) berarti membeli dari negara lain."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>さいきん</span>' yang paling tepat.","options":["さいきんりょうりができたので、いっしょに食べましょう。","さいきん しゅくだいを出してください。","きむらさんは さいきん けっこんしたそうです。","さいきん 電車が来ますから、いそいでえきに行きましょう。"],"correctAnswer":"きむらさんは さいきん けっこんしたそうです。","explanation":"`さいきん` (saikin) berarti 'akhir-akhir ini'/'baru-baru ini'. Kalimat 3 adalah penggunaan yang tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>おと</span>' yang paling tepat.","options":["ラジオのおとが大きいので、もう少し小さくしてください。","日本語の おとが じょうずになりたいので、毎日たくさん話します。","店の人に大きなおとで名前をよばれました。","すずきさんがギターで ゆうめいなおとをひいてくれました。"],"correctAnswer":"ラジオのおとが大きいので、もう少し小さくしてください。","explanation":"`おと` (oto) berarti 'suara' dari benda mati. 'Suara radio' adalah penggunaan yang tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>けんがく</span>' yang paling tepat.","options":["かばんがほしいので、デパートに行ってけんがくします。","わからない かんじは じしょでけんがくしてください。","先生や友だちと こうじょうをけんがくしました。","まいばん テレビで ニュースをけんがくしています。"],"correctAnswer":"先生や友だちと こうじょうをけんがくしました。","explanation":"`けんがく` (kengaku) berarti 'kunjungan belajar' atau 'studi lapangan'. 'Kunjungan ke pabrik' adalah penggunaan yang tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>かざる</span>' yang paling tepat.","options":["やまだ先生は テストのおしらせを きょうしつにかざりました。","おきゃくさんが来ますから、へやに花をかざりましょう。","天気がわるいので、せんたくものはうちの中にかざります。","こっちのエアコンは、となりのへやのかべにかざってください。"],"correctAnswer":"おきゃくさんが来ますから、へやに花をかざりましょう。","explanation":"`かざる` (kazaru) berarti 'menghias' atau 'memajang'. 'Menghias kamar dengan bunga' adalah penggunaan yang tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>こうじ</span>' yang paling tepat.","options":["はがいたかったので、はいしゃで こうじをしてもらいました。","この セーターは古いですが、こうじをして、ずっときています。","ほんだなが こわれてしまったので、こうじをしました。","このみちは こうじをしているので、とおれません。"],"correctAnswer":"このみちは こうじをしているので、とおれません。","explanation":"`こうじ` (kouji) berarti 'pekerjaan konstruksi'. 'Jalan sedang dalam konstruksi' adalah penggunaan yang tepat."},{"type":"Grammar-Isi","question":"きのうのしゅくだいは少なかったので、( ) 終わりました。","options":["20分","20分しか","20分で","20分を"],"correctAnswer":"20分で","explanation":"Partikel `で` setelah durasi waktu menunjukkan total waktu yang dibutuhkan untuk menyelesaikan sesuatu."},{"type":"Grammar-Isi","question":"このロボットは人( )会話することができます。","options":["や","を","の","と"],"correctAnswer":"と","explanation":"Partikel `と` digunakan untuk menunjukkan partner atau lawan interaksi. `人と会話する` (bercakap-cakap dengan orang)."},{"type":"Grammar-Isi","question":"弟は小さいとき よくけがをして、両親( ) 心配させました。","options":["で","を","の","や"],"correctAnswer":"を","explanation":"Dalam kalimat kausatif (menyebabkan), objek yang merasakan emosi ditandai dengan `を`. `両親を心配させる` (membuat orang tua khawatir)."},{"type":"Grammar-Isi","question":"ホテルの朝ご飯のパンがとてもおいしかったので、八つ ( )食べました。","options":["も","に","が","で"],"correctAnswer":"も","explanation":"Partikel `も` setelah kata bilangan menekankan jumlah yang banyak atau luar biasa. 'Saya makan (sampai) delapan buah.'"},{"type":"Grammar-Isi","question":"この日本語のじしょは、150年前に外国人 ( ) 作られました。","options":["から","を","について","によって"],"correctAnswer":"によって","explanation":"Dalam kalimat pasif, `によって` digunakan untuk menunjukkan pelaku. 'Dibuat oleh orang asing.'"},{"type":"Grammar-Isi","question":"A市の運動場は ( )使えますが、予約がひつようです。","options":["だれでも","だれを","だれに","だれが"],"correctAnswer":"だれでも","explanation":"`だれでも` (daredemo) berarti 'siapa saja'. 'Siapa saja bisa menggunakannya.'"},{"type":"Grammar-Isi","question":"前田 「リーさん、いつも( ) 国のかぞくに れんらくしますか。」","options":["どのぐらい","どの","どうやって","どういう"],"correctAnswer":"どうやって","explanation":"`どうやって` (douyatte) berarti 'bagaimana caranya', menanyakan metode."},{"type":"Grammar-Isi","question":"娘は先月 高校を卒業しました。( ) 大学の入学式です。","options":["だんだん","あまり","だいたい","もうすぐ"],"correctAnswer":"もうすぐ","explanation":"`もうすぐ` (mousugu) berarti 'sebentar lagi'."},{"type":"Grammar-Isi","question":"今朝は駅に行くバスが ( ) 来なかったので、タクシーで行きました。","options":["やっと","なかなか","きっと","いつか"],"correctAnswer":"なかなか","explanation":"`なかなか～ない` berarti 'tidak kunjung...'. 'Busnya tidak kunjung datang.'"},{"type":"Grammar-Isi","question":"南「...あしたは都合が悪いけど、あさって( )だいじょうぶだよ。」","options":["なのに","だから","でも","なら"],"correctAnswer":"なら","explanation":"`なら` (nara) digunakan untuk membuat topik dari usulan lawan bicara. 'Kalau besok lusa, tidak apa-apa.'"},{"type":"Grammar-Isi","question":"私は ( )間、スーパーでアルバイトをしていました。","options":["夏休みに","夏休みで","夏休みの","夏休み"],"correctAnswer":"夏休みの","explanation":"Untuk menggabungkan dua kata benda, digunakan partikel `の`. `夏休みの間` (selama liburan musim panas)."},{"type":"Grammar-Isi","question":"先週庭の木のえだを切りました。ぜんぶ( ) 2時間かかりました。","options":["切ったり","切るのに","切りに","切るかどうか"],"correctAnswer":"切るのに","explanation":"Pola `[Bentuk Kamus] + のに` digunakan untuk menyatakan tujuan atau untuk apa waktu/uang dihabiskan."},{"type":"Grammar-Isi","question":"山田「...午前中に用事があるので、( )。」","options":["遅れないでください","遅れないほうがいいです","遅れるかもしれません","遅れてはいけません"],"correctAnswer":"遅れるかもしれません","explanation":"`～かもしれません` (kamoshiremasen) berarti 'mungkin...'. Menyatakan kemungkinan akan terlambat."},{"type":"Grammar-Isi","question":"田中「ええ。あ、でも、あそこの席が( )よ。」","options":["空きそうです","空きました","空いています","空いたようです"],"correctAnswer":"空きそうです","explanation":"`[Bentuk-masu] + そうです` berarti 'sepertinya akan...'. 'Sepertinya kursi itu akan kosong.'"},{"type":"Grammar-Isi","question":"上田「...いすが一つ足りないので、となりの会議室から ( )」","options":["持ってこなくてもいいですか","持ってきてもらえますか","持ってこないといけませんか","持ってきていませんか"],"correctAnswer":"持ってきてもらえますか","explanation":"`～てもらえますか` adalah cara sopan untuk meminta seseorang melakukan sesuatu. 'Bisakah Anda mengambilkannya?'"},{"type":"Grammar-Urutan","question":"先月まで 花屋があった ___ ★ ___ ___ おいしいです。<br>Pilih kata di posisi ★.","options":["できた","りんごのケーキが","きっさてんは","場所に"],"correctAnswer":"きっさてんは","explanation":"Urutan: 場所に(4) できた(1) きっさてんは(3)★ りんごのケーキが(2) おいしいです。 (Kafe yang buka di tempat di mana dulu ada toko bunga, kue apelnya enak)."},{"type":"Grammar-Urutan","question":"きのうの夜家に帰ってから、かぎを ___ ___ ★ ___ 覚えていません。<br>Pilih kata di posisi ★.","options":["どこ","置いた","に","か"],"correctAnswer":"に","explanation":"Urutan: どこ(1)に(3)★ 置いた(2)か(4) 覚えていません。 (Saya tidak ingat di mana saya meletakkan kuncinya)."},{"type":"Grammar-Urutan","question":"私はピアノを ___ ★ ___ ___ 時間がありません。<br>Pilih kata di posisi ★.","options":["ひくのが","ひく","最近 いそがしくて","好きですが"],"correctAnswer":"好きですが","explanation":"Urutan: ひくのが(1) 好きですが(4)★ 最近 いそがしくて(3) ひく(2) 時間がありません。 (Saya suka bermain piano, tetapi akhir-akhir ini sibuk dan tidak punya waktu)."},{"type":"Grammar-Urutan","question":"私は 20さいのたんじょうびにそふが ___ ___ ★ ___ います。<br>Pilih kata di posisi ★.","options":["大切に","くれた","使って","カメラを"],"correctAnswer":"使って","explanation":"Urutan: くれた(2) カメラを(4) 大切に(1)★ 使って(3) います。 (Saya menggunakan dengan baik kamera yang diberikan kakek saya)."},{"type":"Grammar-Urutan","question":"リー「...いいですね。___ ___ ★ ___ です。」<br>Pilih kata di posisi ★.","options":["ぜひ行きたい","ことがない","見に行った","ん"],"correctAnswer":"ぜひ行きたい","explanation":"Urutan: 見に行った(3) ことがない(2) ん(4)★ ですから、ぜひ行きたい(1) です。 (Karena saya belum pernah pergi menonton, saya sangat ingin pergi)."}],"3":[{"type":"Hiragana","question":"くつに<span class='underline'>石</span>が入っていました。","options":["いし","すな","くさ","えだ"],"correctAnswer":"いし","explanation":"Kanji `石` (いし) dibaca 'ishi' yang berarti batu."},{"type":"Hiragana","question":"にほんでいろいろな<span class='underline'>経験</span>を...","options":["けいけん","けいげん","けけん","けげん"],"correctAnswer":"けいけん","explanation":"Kanji `経験` dibaca 'keiken' yang berarti pengalaman."},{"type":"Hiragana","question":"<span class='underline'>店員</span>にトイレがどこにあるか聞きました。","options":["てにん","てんにん","ていん","てんいん"],"correctAnswer":"てんいん","explanation":"Kanji `店員` dibaca 'ten-in' yang berarti pegawai toko."},{"type":"Hiragana","question":"きょうは<span class='underline'>食堂</span>がこんでいました。","options":["しゅくと","しょくどう","しょくど","しゅくどう"],"correctAnswer":"しょくどう","explanation":"Kanji `食堂` dibaca 'shokudou' yang berarti kantin."},{"type":"Hiragana","question":"このまどから<span class='underline'>港</span>が見えます。","options":["うみ","みなと","みずうみ","いけ"],"correctAnswer":"みなと","explanation":"Kanji `港` (みなと) dibaca 'minato' yang berarti pelabuhan."},{"type":"Hiragana","question":"この<span class='underline'>小説</span>はおもしろかったです。","options":["しょせつ","しょぜつ","しょうせつ","しょうぜつ"],"correctAnswer":"しょうせつ","explanation":"Kanji `小説` dibaca 'shousetsu' yang berarti novel."},{"type":"Hiragana","question":"まいばん <span class='underline'>日記</span>を書いています。","options":["にっき","にちき","にっきい","にちきい"],"correctAnswer":"にっき","explanation":"Kanji `日記` dibaca 'nikki' yang berarti buku harian."},{"type":"Hiragana","question":"<span class='underline'>夕方</span>、雨がふりました。","options":["ゆうほう","ゆうがた","ゆほう","ゆがた"],"correctAnswer":"ゆうがた","explanation":"Kanji `夕方` dibaca 'yuugata' yang berarti sore hari."},{"type":"Hiragana","question":"もうすぐ<span class='underline'>秋</span>ですね。","options":["ふゆ","なつ","はる","あき"],"correctAnswer":"あき","explanation":"Kanji `秋` (あき) dibaca 'aki' yang berarti musim gugur."},{"type":"Kanji","question":"すずきさんは <span class='underline'>あおい</span> シャツをきています。","options":["青い","黒い","赤い","白い"],"correctAnswer":"青い","explanation":"`あおい` (aoi - biru) ditulis dengan kanji `青い`."},{"type":"Kanji","question":"かいぎの<span class='underline'>ばしょ</span>をおしえてください。","options":["揚所","場所","所","場所"],"correctAnswer":"場所","explanation":"`ばしょ` (basho - tempat) ditulis dengan kanji `場所`."},{"type":"Kanji","question":"わたしのいえは えきから <span class='underline'>あるいて</span>5分です。","options":["走いて","走いて","歩いて","歩いて"],"correctAnswer":"歩いて","explanation":"`あるいて` (aruite - berjalan kaki) ditulis dengan kanji `歩いて`."},{"type":"Kanji","question":"ちかてつができて<span class='underline'>べんり</span>になりました。","options":["便利","便理","便理","便利"],"correctAnswer":"便利","explanation":"`べんり` (benri - praktis) ditulis dengan kanji `便利`."},{"type":"Kanji","question":"とても <span class='underline'>ねむかった</span>ので、コーヒーを飲みました。","options":["眠むかった","眠かった","眠むかった","眠かった"],"correctAnswer":"眠かった","explanation":"`ねむかった` (nemukatta - mengantuk) ditulis dengan kanji `眠かった`."},{"type":"Kanji","question":"きょうは<span class='underline'>ゆき</span>がふっています。","options":["雪","電","雷","雲"],"correctAnswer":"雪","explanation":"`ゆき` (yuki - salju) ditulis dengan kanji `雪`."},{"type":"Kosakata-Isi","question":"けさ せんたくしたふくがまだ ( ) いません。","options":["ひえて","なおって","ぬれて","かわいて"],"correctAnswer":"かわいて","explanation":"`かわいて` (kawaite) dari `乾く` (kawaku) berarti 'kering'."},{"type":"Kosakata-Isi","question":"スミスさんはいつも ( )べんきょうしています。","options":["だいじに","たいせつに","ねっしんに","まっすぐに"],"correctAnswer":"ねっしんに","explanation":"`ねっしんに` (nesshin ni) berarti 'dengan tekun/antusias'."},{"type":"Kosakata-Isi","question":"わたしはにほんのまんがに ( )があります。","options":["きぶん","きょうみ","こころ","しゅみ"],"correctAnswer":"きょうみ","explanation":"`きょうみ` (kyoumi) berarti 'minat'. `興味があります` berarti 'tertarik pada...'."},{"type":"Kosakata-Isi","question":"わたしは テニスの( )を よくしりません。","options":["アイディア","ルール","あんない","せつめい"],"correctAnswer":"ルール","explanation":"`ルール` (ruuru) berarti 'aturan'."},{"type":"Kosakata-Isi","question":"りょこうのにもつはもう ( ) できましたか。","options":["やくそく","りよう","せわ","ようい"],"correctAnswer":"ようい","explanation":"`ようい` (youi) berarti 'persiapan'."},{"type":"Kosakata-Isi","question":"おとうとと ( ) して母にあげる プレゼントをえらびました。","options":["さんせい","あいさつ","そうだん","へんじ"],"correctAnswer":"そうだん","explanation":"`そうだん` (soudan) berarti 'berdiskusi'."},{"type":"Kosakata-Isi","question":"このにもつをあそこに( ) ください。","options":["はこんで","つたえて","ひろって","むかえて"],"correctAnswer":"はこんで","explanation":"`はこんで` (hakonde) dari `運ぶ` (hakobu) berarti 'mengangkut/memindahkan'."},{"type":"Kosakata-Isi","question":"このきかいはつかいかたをまちがえるととても( )です。","options":["けっこう","きけん","じゆう","あんぜん"],"correctAnswer":"きけん","explanation":"`きけん` (kiken) berarti 'berbahaya'."},{"type":"Kosakata-Isi","question":"入口の前には車を( ) ください。","options":["やめないで","しめないで","とめないで","きめないで"],"correctAnswer":"とめないで","explanation":"`とめないで` dari `止める` (tomeru) berarti 'jangan berhenti/parkir'."},{"type":"Kosakata-Sinonim","question":"<u>バスが しゅっぱつしました。</u>","options":["バスがとまりました。","バスがつきました。","バスがでました。","バスがまがりました。"],"correctAnswer":"バスがでました。","explanation":"`しゅっぱつしました` (telah berangkat) bersinonim dengan `でました` (telah keluar/berangkat)."},{"type":"Kosakata-Sinonim","question":"<u>もっと ていねいにかいてください。</u>","options":["もっと おおきく かいてください。","もっと きれいにかいてください。","もっと ふとくかいてください。","もっと かんたんにかいてください。"],"correctAnswer":"もっと きれいにかいてください。","explanation":"`ていねいに` (dengan rapi/sopan) dalam konteks menulis, paling dekat artinya dengan `きれいに` (dengan bersih/rapi)."},{"type":"Kosakata-Sinonim","question":"<u>あにはえがうまいです。</u>","options":["あにはえがじょうずです。","あにはえがきらいです。","あにはえがへたです。","あにはえがすきです。"],"correctAnswer":"あにはえがじょうずです。","explanation":"`うまい` (mahir/enak) dalam konteks keahlian bersinomin dengan `じょうず` (mahir)."},{"type":"Kosakata-Sinonim","question":"<u>きのうはねぼうしました。</u>","options":["...ねるのがおそくなってしまいました。","...はやくねてしまいました。","...おきるのがおそくなってしまいました。","...はやくおきてしまいました。"],"correctAnswer":"...おきるのがおそくなってしまいました。","explanation":"`ねぼうしました` (kesiangan) berarti `おきるのがおそくなってしまいました` (bangunnya jadi terlambat)."},{"type":"Kosakata-Sinonim","question":"<u>たなかさんは先生にほめられました。</u>","options":["先生は...「気をつけてね」と言いました。","先生は...「とてもよかったですよ」と言いました。","先生は...「ちょっと休みましょう」と言いました。","先生は...「たいへんですね」と言いました。"],"correctAnswer":"先生は...「とてもよかったですよ」と言いました。","explanation":"`ほめられました` (dipuji) berarti menerima perkataan baik seperti `とてもよかったですよ` (sangat bagus ya)."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>るす</span>' yang paling tepat.","options":["さいきん いそがしくて、しごとがるすになりません。","あのデパートはきょうはるすです。","この ひこうきにはるすのせきがありません。","ともだちのいえに行ったらるすでした。"],"correctAnswer":"ともだちのいえに行ったらるすでした。","explanation":"`るす` (rusu) berarti 'tidak berada di tempat (rumah/kantor)'. Kalimat 4 adalah penggunaan yang tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>しんせつ</span>' yang paling tepat.","options":["この りょうりはからだにとてもしんせつですよ。","コンビニは何でも買えるのでとても しんせつです。","この びょういんのおいしゃさんはとても しんせつですよ。","わたしの母はにわの花にとてもしんせつです。"],"correctAnswer":"この びょういんのおいしゃさんはとても しんせつですよ。","explanation":"`しんせつ` (shinsetsu) berarti 'baik hati' dan digunakan untuk orang. Kalimat 3 adalah penggunaan yang tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>にがい</span>' yang paling tepat.","options":["かぜをひいたので、こえがにがいです。","くらい みちを一人であるくのはにがいです。","にもつがおもかったので、うでがにがいです。","このくすりはとてもにがいです。"],"correctAnswer":"このくすりはとてもにがいです。","explanation":"`にがい` (nigai) berarti 'pahit'. Kalimat 4 'Obat ini sangat pahit' adalah penggunaan yang tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>わる</span>' yang paling tepat.","options":["おさらをおとして、わってしまいました。","しんぶんをわって、かばんに入れました。","ようふくをわって、母におこられました。","このジャムを三本のびんにわってください。"],"correctAnswer":"おさらをおとして、わってしまいました。","explanation":"`わる` (waru) dalam bentuk `わって` (watte) berarti 'memecahkan'. Kalimat 1 'Saya menjatuhkan dan memecahkan piring' adalah penggunaan yang tepat."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>ちこく</span>' yang paling tepat.","options":["あの とけいはちょっとちこくしています。","じゅぎょうにちこくしてすみません。","10時の でんしゃにちこくしてしまいました。","れんらくがちこくしてすみません。"],"correctAnswer":"じゅぎょうにちこくしてすみません。","explanation":"`ちこく` (chikoku) berarti 'terlambat' untuk suatu acara/jadwal. Kalimat 2 'Maaf saya terlambat masuk kelas' adalah penggunaan yang paling tepat."},{"type":"Grammar-Isi","question":"わたしの父は中国語も英語( ) 話せます。","options":["を","で","も","が"],"correctAnswer":"が","explanation":"Dalam kalimat bentuk potensial (`話せます`), objek sering ditandai dengan partikel `が`."},{"type":"Grammar-Isi","question":"これはわたしが米( ) 作ったパンです。","options":["に","の","で","で"],"correctAnswer":"で","explanation":"Partikel `で` digunakan untuk menunjukkan bahan atau material. `米で作った` (dibuat dari beras)."},{"type":"Grammar-Isi","question":"男の子の顔は父親より母親( )にると...","options":["に","と","も","を"],"correctAnswer":"に","explanation":"Kata kerja `にる` (niru - mirip) selalu menggunakan partikel `に` untuk objek yang dimiripi."},{"type":"Grammar-Isi","question":"妹はおしゃべりだ。静かなのは、食事のとき( )だ。","options":["しか","だけ","に","の"],"correctAnswer":"だけ","explanation":"`だけ` (dake) berarti 'hanya'. `しか` harus diikuti bentuk negatif."},{"type":"Grammar-Isi","question":"B「田中さん( ) 腕時計をもらいました。」","options":["からが","からに","からで","からは"],"correctAnswer":"からは","explanation":"Partikel `は` di sini digunakan untuk memberikan penekanan pada `田中さんから` (dari Tanaka-san)."},{"type":"Grammar-Isi","question":"B「...会議は11時半 ( ) 終わると思いますよ。」","options":["までは","までには","までも","までにも"],"correctAnswer":"までには","explanation":"`までには` berarti 'paling lambat pada...' atau 'sebelum...'"},{"type":"Grammar-Isi","question":"学生「先生、この言葉は( ) 意味ですか。」","options":["どうやって","どのぐらい","どういう","どう"],"correctAnswer":"どういう","explanation":"`どういう意味` (arti seperti apa) digunakan untuk meminta penjelasan."},{"type":"Grammar-Isi","question":"古川「...きのうの夜、( )終わりました。」","options":["やっと","ずっと","もっと","きっと"],"correctAnswer":"やっと","explanation":"`やっと` (yatto) berarti 'akhirnya' (setelah melalui usaha)."},{"type":"Grammar-Isi","question":"B「( )、ごめんなさい、あしたはアルバイトがあるんです。」","options":["行きたいから","行きたいけれど","行きたいし","行きたくて"],"correctAnswer":"行きたいけれど","explanation":"`～たいけれど` berarti 'ingin..., tetapi...'. Digunakan untuk menolak ajakan secara halus."},{"type":"Grammar-Isi","question":"母親「しゅくだいを( )あとでね。」","options":["していた","している","する","した"],"correctAnswer":"した","explanation":"Pola `～たあとで` (setelah melakukan...) membutuhkan kata kerja bentuk lampau (Ta-form)."},{"type":"Grammar-Isi","question":"このすいかは ( ) すぎて、れいぞうこに入らない。","options":["大き","大きい","大きく","大きくて"],"correctAnswer":"大き","explanation":"Pola `～すぎる` (terlalu...) untuk kata sifat-i, bagian `い` dihilangkan. `大きい` -> `大きすぎる`."},{"type":"Grammar-Isi","question":"B「ありがとうございます。大切に( )。」","options":["します","います","なります","あります"],"correctAnswer":"します","explanation":"`大切にします` (taisetsu ni shimasu) adalah ungkapan umum yang berarti 'akan saya jaga baik-baik'."},{"type":"Grammar-Isi","question":"A 「きのうはひっこしを ( )、どうもありがとうございました。」","options":["手伝って","手伝ったので","手伝ってくれて","手伝ったから"],"correctAnswer":"手伝ってくれて","explanation":"`～てくれてありがとう` adalah ungkapan terima kasih karena seseorang telah melakukan sesuatu untuk kita."},{"type":"Grammar-Isi","question":"...となりの人に貸して ( )。","options":["やりました","あげました","くれました","もらいました"],"correctAnswer":"もらいました","explanation":"`～てもらいました` berarti 'menerima kebaikan'. 'Saya dipinjami oleh orang di sebelah saya.'"},{"type":"Grammar-Isi","question":"わたしの本だなには( ) 読んでいない まんががたくさんあります。","options":["買うあいだ","買ったまま","買いそうで","買っている"],"correctAnswer":"買ったまま","explanation":"Pola `～たまま` berarti 'dalam keadaan...'. `買ったまま` (dalam keadaan setelah dibeli), artinya belum dibaca."},{"type":"Grammar-Urutan","question":"B「今すぐ ___ ★ ___ ___ 行こう。」<br>Pilih kata di posisi ★.","options":["タクシーに","タクシーで","間に合うかもしれないから","乗れば"],"correctAnswer":"間に合うかもしれないから","explanation":"Urutan: タクシーに(1) 乗れば(4) 間に合うかもしれないから(3)★ タクシーで(2) 行こう."},{"type":"Grammar-Urutan","question":"田中「すみません。ちょうど ___ ★ ___ ___ です。」<br>Pilih kata di posisi ★.","options":["ごはん","ところ","食べた","今"],"correctAnswer":"ところ","explanation":"Urutan: 今(4) ごはんを(1) 食べた(3)★ ところ(2) です。 Pola `～たところです` berarti 'baru saja selesai...'"},{"type":"Grammar-Urutan","question":"A「... ___ ★ ___ ___ いけませんよ。」<br>Pilih kata di posisi ★.","options":["くつ","は","そんな","で"],"correctAnswer":"で","explanation":"Urutan: そんな(3) きたない(hilang) くつ(1)で(4)★ は(2) いけませんよ。 (Tidak boleh datang dengan sepatu sekotor itu)."},{"type":"Grammar-Urutan","question":"今日は、風が ___ ★ ___ ___ 出かけたくない。<br>Pilih kata di posisi ★.","options":["し","だから","寒そう","強い"],"correctAnswer":"寒そう","explanation":"Urutan: 強い(4)し(1)、寒そう(3)★ だから(2) 出かけたくない。 (Karena anginnya kencang dan kelihatannya dingin, saya tidak ingin keluar)."},{"type":"Grammar-Urutan","question":"山田「...もし両親に ___ ___ ★ ___ つもりです。」<br>Pilih kata di posisi ★.","options":["反対","する","東京で勉強","されても"],"correctAnswer":"されても","explanation":"Urutan: 反対(1) されても(4)★ 東京で勉強(3) する(2) つもりです。 (Bahkan jika ditentang, saya bermaksud untuk belajar di Tokyo)."},{"type":"Grammar-Bacaan","question":"わたしたちはポチを家の中で (21)","options":["かうでしょう","かっています","かっていますか","かっていました"],"correctAnswer":"かっています","explanation":"`かっています` (sedang memelihara) menunjukkan kondisi saat ini."},{"type":"Grammar-Bacaan","question":"ポチが父のけいたいでんわを (22) からです。","options":["こわしたところだ","こわされている","こわしてしまった","こわされた"],"correctAnswer":"こわしてしまった","explanation":"`～てしまった` menunjukkan kejadian yang tidak diinginkan atau penyesalan."},{"type":"Grammar-Bacaan","question":"しかし、ポチをかってからは、(23)。","options":["さびしくなります","さびしくなくなりました","さびしくなるかもしれません","さびしくなくなったそうです"],"correctAnswer":"さびしくなくなりました","explanation":"`～なくなりました` menunjukkan perubahan menjadi tidak lagi merasakan/melakukan sesuatu."},{"type":"Grammar-Bacaan","question":"(24)、元気がないときは、そばに来てくれます。","options":["それに","たとえば","だから","それなら"],"correctAnswer":"それに","explanation":"`それに` (selain itu) digunakan untuk menambahkan informasi."},{"type":"Grammar-Bacaan","question":"ポチ (25) わたしたちの大切な家族の一員です。","options":["が","で","と","は"],"correctAnswer":"は","explanation":"Partikel `は` (wa) digunakan untuk menandai topik utama kalimat."}],"4":[{"type":"Hiragana","question":"バスが 8時に<span class='underline'>出発</span>します。","options":["しゅっぱつ","しゅうはつ","しゅぱつ","しゅうぱつ"],"correctAnswer":"しゅっぱつ","explanation":"Kanji `出発` dibaca 'shuppatsu' yang berarti berangkat."},{"type":"Hiragana","question":"すぐに<span class='underline'>答え</span>てください。","options":["おぼえて","おしえて","かんがえて","こたえて"],"correctAnswer":"こたえて","explanation":"Kanji `答える` (こたえる) dibaca 'kotaeru' yang berarti menjawab."},{"type":"Hiragana","question":"あの人は<span class='underline'>心</span>がきれいです。","options":["きもち","あたま","かたち","こころ"],"correctAnswer":"こころ","explanation":"Kanji `心` (こころ) dibaca 'kokoro' yang berarti hati atau jiwa."},{"type":"Hiragana","question":"<span class='underline'>最後</span>のページを見てください。","options":["さいしょ","さいご","せいご","せいしょ"],"correctAnswer":"さいご","explanation":"Kanji `最後` dibaca 'saigo' yang berarti terakhir."},{"type":"Hiragana","question":"このみちを行くと、少し<span class='underline'>遠い</span>です。","options":["おそい","ちかい","とおい","はやい"],"correctAnswer":"とおい","explanation":"Kanji `遠い` (とおい) dibaca 'tooi' yang berarti jauh."},{"type":"Hiragana","question":"おととしの<span class='underline'>冬</span>、日本をりょこうしました。","options":["あき","ふゆ","なつ","はる"],"correctAnswer":"ふゆ","explanation":"Kanji `冬` (ふゆ) dibaca 'fuyu' yang berarti musim dingin."},{"type":"Hiragana","question":"あしたのじゅぎょうの<span class='underline'>予習</span>をします。","options":["よしゅう","ようしゅう","よしゅ","ようしゅ"],"correctAnswer":"よしゅう","explanation":"Kanji `予習` dibaca 'yoshuu' yang berarti persiapan pelajaran."},{"type":"Kanji","question":"としょかんで<span class='underline'>えいが</span>の本をかりました。","options":["映語","英語","英画","映画"],"correctAnswer":"映画","explanation":"`えいが` (eiga - film) ditulis dengan kanji `映画`."},{"type":"Kanji","question":"すずきさんは何を<span class='underline'>つくって</span>いますか。","options":["送って","使って","作って","売って"],"correctAnswer":"作って","explanation":"`つくって` (tsukutte - membuat) ditulis dengan kanji `作って`."},{"type":"Kanji","question":"たくさん<span class='underline'>うんどう</span>をしたので、つかれました。","options":["運動","連動","運働","連働"],"correctAnswer":"運動","explanation":"`うんどう` (undou - olahraga) ditulis dengan kanji `運動`."},{"type":"Kanji","question":"あそこに大きな<span class='underline'>ふね</span>が見えます。","options":["寺","船","鳥","雲"],"correctAnswer":"船","explanation":"`ふね` (fune - kapal) ditulis dengan kanji `船`."},{"type":"Kanji","question":"わからないかんじを じしょで<span class='underline'>しらべる</span>。","options":["探べる","知べる","調べる","研べる"],"correctAnswer":"調べる","explanation":"`しらべる` (shiraberu - memeriksa/mencari tahu) ditulis dengan kanji `調べる`."},{"type":"Kosakata-Isi","question":"たくさん話したので( )がいたいです。","options":["のど","ひげ","ゆび","うで"],"correctAnswer":"のど","explanation":"`のど` (nodo) berarti tenggorokan."},{"type":"Kosakata-Isi","question":"のった電車はとても( )いたので、すわれませんでした。","options":["あつまって","こんで","たりて","くりかえして"],"correctAnswer":"こんで","explanation":"`こんで` dari `込む` (komu) berarti 'ramai/penuh'."},{"type":"Kosakata-Isi","question":"...いろいろな( )をしました。","options":["けいけん","しゅうかん","きょうみ","けっか"],"correctAnswer":"けいけん","explanation":"`けいけん` (keiken) berarti 'pengalaman'."},{"type":"Kosakata-Isi","question":"どんなまんががすきか、小学生に( )をしました。","options":["コンサート","コンピュータ","アンケート","アルコール"],"correctAnswer":"アンケート","explanation":"`アンケート` (ankeeto) berarti 'angket/survei'."},{"type":"Kosakata-Isi","question":"わたしがかりているアパートの( )は1か月7万円です。","options":["ふりこみ","ちょきん","おつり","やちん"],"correctAnswer":"やちん","explanation":"`やちん` (yachin) berarti 'uang sewa rumah'."},{"type":"Kosakata-Isi","question":"このしゃしんに( )いるのはわたしのりょうしんです。","options":["かかって","ついて","うつって","とどいて"],"correctAnswer":"うつって","explanation":"`うつって` dari `写る` (utsuru) berarti 'terfoto'."},{"type":"Kosakata-Isi","question":"しんかんせんのきっぷは、かたみちなら1万円、( )なら2万円です。","options":["かいてん","おうふく","うんてん","あんない"],"correctAnswer":"おうふく","explanation":"`おうふく` (oufuku) berarti 'pulang pergi'."},{"type":"Kosakata-Isi","question":"ひっこしのとき、さらはかみで( ) はこに入れます。","options":["ひろって","かたづけて","つかまえて","つつんで"],"correctAnswer":"つつんで","explanation":"`つつんで` dari `包む` (tsutsumu) berarti 'membungkus'."},{"type":"Kosakata-Sinonim","question":"<u>この話はひみつです。</u>","options":["...みんなにはなしてください。","...だれにも言わないでください。","...みんなにも聞きましょう。","...だれもしりたくないです。"],"correctAnswer":"...だれにも言わないでください。","explanation":"`ひみつです` (ini rahasia) berarti `だれにも言わないでください` (jangan katakan kepada siapa pun)."},{"type":"Kosakata-Sinonim","question":"<u>もりさんはにこにこしていました。</u>","options":["...やすんでいました。","...あそんでいました。","...うたっていました。","...わらっていました。"],"correctAnswer":"...わらっていました。","explanation":"`にこにこしていました` (sedang tersenyum) paling dekat artinya dengan `わらっていました` (sedang tertawa/tersenyum)."},{"type":"Kosakata-Sinonim","question":"<u>たなかさんはどくしんです。</u>","options":["...けっこんしています。","...けっこんしていません。","...ひとりですんでいます。","...はたらいていません。"],"correctAnswer":"...けっこんしていません。","explanation":"`どくしん` (lajang) berarti `けっこんしていません` (belum menikah)."},{"type":"Kosakata-Sinonim","question":"<u>これはやわらかいです。</u>","options":["これはかたくないですね。","これはにがくないですね。","これはつめたくないですれ。","これはきたなくないです权。"],"correctAnswer":"これはかたくないですね。","explanation":"`やわらかい` (lembut/empuk) adalah lawan kata dari `かたい` (keras)."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>れんらく</span>' yang paling tepat.","options":["きこくしたら、おれいのてがみを やまださんにれんらくします。","アルバイトに行く日をカレンダーにれんらくしておきます。","はじめて会った人にめいしをれんらくして、あいさつをしました。","あしたのかいぎの時間をはやしさんにれんらくしました。"],"correctAnswer":"あしたのかいぎの時間をはやしさんにれんらくしました。","explanation":"`れんらく` (renraku) berarti 'menghubungi' atau 'memberi informasi'."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>むしあつい</span>' yang paling tepat.","options":["ゆうべはむしあつくて、あまりねられませんでした。","あのひとはむしあついので、すきではありません。","このりょうりはむしあついほうがおいしいです。","このコートはむしあつくて、きやすいです。"],"correctAnswer":"ゆうべはむしあつくて、あまりねられませんでした。","explanation":"`むしあつい` (mushiatsui) berarti 'panas dan lembab' (cuaca)."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>けいかく</span>' yang paling tepat.","options":["ひこうきのチケットは電話かメールでけいかくができます。","あしたはゆうがたから雨がふる けいかくです。","来月行く りょこうのけいかくがまだきまっていません。","来週は しごとが いそがしくなる けいかくです。"],"correctAnswer":"来月行く りょこうのけいかくがまだきまっていません。","explanation":"`けいかく` (keikaku) berarti 'rencana'."},{"type":"Kosakata-Penggunaan","question":"Pilih penggunaan kata '<span class='usage-word'>そだてる</span>' yang paling tepat.","options":["母が そだてた花がきれいにさきました。","外国に行きたいので、お金をそだてています。","おきゃくさんが来るので、あさからごちそうをそだてました。","1年前から そだてているビルがもうすぐできます。"],"correctAnswer":"母が そだてた花がきれいにさきました。","explanation":"`そだてる` (sodateru) berarti 'membesarkan' atau 'merawat' (tanaman, hewan, anak)."},{"type":"Grammar-Isi","question":"...わたしもピアノを習うこと( )しました。","options":["を","が","に","で"],"correctAnswer":"に","explanation":"Pola `～ことにする` (memutuskan untuk...) selalu menggunakan partikel `に`."},{"type":"Grammar-Isi","question":"ジョン「ざんねんですが、一週間 ( ) いられません。」","options":["だけ","しか","くらい","でも"],"correctAnswer":"しか","explanation":"`しか` (hanya) selalu digunakan dengan bentuk negatif."},{"type":"Grammar-Isi","question":"今日は午後から雨が降る () 聞いたので、かさを持ってきました。","options":["は","の","と","と"],"correctAnswer":"と","explanation":"`～と聞く` adalah pola untuk mengutip informasi yang didengar, 'mendengar bahwa...'"},{"type":"Grammar-Isi","question":"私の兄は、テニスもサッカー ( ) 上手です。","options":["が","も","で","を"],"correctAnswer":"も","explanation":"Pola `AもBも` digunakan untuk menyebutkan beberapa hal secara setara."},{"type":"Grammar-Isi","question":"A 「きのうの夜、( ) 電話に出なかったんですか。」","options":["どう","どうやって","どんな","どうして"],"correctAnswer":"どうして","explanation":"`どうして` (doushite) berarti 'mengapa'."},{"type":"Grammar-Isi","question":"父は朝ごはんの前に( )新聞を読む。","options":["もうすく","かならず","なかなか","だんだん"],"correctAnswer":"かならず","explanation":"`かならず` (kanarazu) berarti 'pasti' atau 'selalu'."},{"type":"Grammar-Isi","question":"このアニメは世界( )の子どもたちに人気がある。","options":["など","ずつ","間","中"],"correctAnswer":"中","explanation":"`～中` (juu) yang dilekatkan pada kata benda berarti 'seluruh...'. `世界中` (seluruh dunia)."},{"type":"Grammar-Isi","question":"このパソコンは何回( ) またすぐこわれる。","options":["なおすまえ","なおすとき","なおしても","なおしてから"],"correctAnswer":"なおしても","explanation":"Pola `～ても` (te-mo) berarti 'meskipun...'. `なおしても` (meskipun diperbaiki)."},{"type":"Grammar-Isi","question":"田中さんは先生に作文を( )よろこんでいました。","options":["ほめて","ほめてしまって","ほめられて","ほめさせて"],"correctAnswer":"ほめられて","explanation":"Kalimat ini membutuhkan bentuk pasif (`られる`). `ほめられて` (dipuji)."},{"type":"Grammar-Isi","question":"私は医者に( )ためにいっしょうけんめい勉強しています。","options":["なる","なり","なれる","なって"],"correctAnswer":"なる","explanation":"Pola `～ために` (untuk/demi) diikuti oleh kata kerja bentuk kamus."},{"type":"Grammar-Isi","question":"A 「...山田さんのけいたい電話のばんごうを( )。」","options":["教えてくれませんか","教えましょうか","教えてもいいです","教えましょう"],"correctAnswer":"教えてくれませんか","explanation":"`～てくれませんか` adalah cara sopan untuk meminta tolong."},{"type":"Grammar-Isi","question":"田中さんのけっこんパーティーが、今週の土曜日に( )。","options":["開きます","開きましょう","開くでしょう","開かれます"],"correctAnswer":"開かれます","explanation":"`開かれます` (hirakaremasu) adalah bentuk pasif yang sering digunakan untuk menyatakan sebuah acara 'diadakan'."},{"type":"Grammar-Isi","question":"中田「ああ、だから最近じゅぎょうのあと急いで( )ね。」","options":["帰っているんです","帰っていることです","帰っているからです","帰っているところです"],"correctAnswer":"帰っているんです","explanation":"`～んです` digunakan untuk memberikan penjelasan atau alasan."},{"type":"Grammar-Urutan","question":"A 「すみません。山下さんが今 ___ ___ ★ ___ わかりますか。」<br>Pilih kata di posisi ★.","options":["か","に","いる","どこ"],"correctAnswer":"に","explanation":"Urutan: どこ(4)に(2)★ いる(3)か(1) わかりますか。 (Apakah Anda tahu di mana Yamashita-san sekarang?)."},{"type":"Grammar-Urutan","question":"来週、友だちがうちに ___ ★ ___ ___ になりました。<br>Pilih kata di posisi ★.","options":["とまり","来る","に","こと"],"correctAnswer":"に","explanation":"Urutan: とまり(1)に(3)★ 来る(2)こと(4) になりました。 (Telah diputuskan bahwa teman akan datang untuk menginap)."},{"type":"Grammar-Urutan","question":"先生「...じしょを、___ ★ ___ ___ ようにしてください。」<br>Pilih kata di posisi ★.","options":["持ってくる","忘れない","を","の"],"correctAnswer":"忘れない","explanation":"Urutan: 持ってくる(1)のを(4) 忘れない(2)★ ようにしてください。 (Berusahalah untuk tidak lupa membawa kamus)."},{"type":"Grammar-Urutan","question":"私はいつもコーヒーは ___ ___ ★ ___ コーヒーも飲みたくなる。<br>Pilih kata di posisi ★.","options":["ときどき","さとうを入れないで","あまい","飲むが"],"correctAnswer":"あまい","explanation":"Urutan: さとうを入れないで(2) 飲むが(4)、ときどき(1) あまい(3)★ コーヒーも飲みたくなる。 (Biasanya saya minum kopi tanpa gula, tapi kadang-kadang ingin juga minum kopi yang manis)."}],"5":[{"type":"Hiragana","question":"今日はとても<span class='underline'>楽しかった</span>ですね。","options":["いそがしかった","すずしかった","たのしかった","かなしかった"],"correctAnswer":"たのしかった","explanation":"Kanji `楽しい` (たのしい) dibaca 'tanoshii' yang berarti menyenangkan."},{"type":"Hiragana","question":"わたしはこの<span class='underline'>味</span>がすきです。","options":["かたち","いろ","におい","あじ"],"correctAnswer":"あじ","explanation":"Kanji `味` (あじ) dibaca 'aji' yang berarti rasa."},{"type":"Hiragana","question":"このあたりはちよっと<span class='underline'>不便</span>ですね。","options":["ふべん","ぶべん","ふへん","ぶへん"],"correctAnswer":"ふべん","explanation":"Kanji `不便` dibaca 'fuben' yang berarti tidak praktis."},{"type":"Hiragana","question":"やさいを<span class='underline'>切って</span>ください。","options":["とって","きって","あらって","もって"],"correctAnswer":"きって","explanation":"Kanji `切る` (きる) dalam bentuk -te menjadi `切って` (kitte), yang berarti memotong."},{"type":"Hiragana","question":"はやしさん<span class='underline'>以外</span>はみんな来ました。","options":["にそと","にがい","いそと","いがい"],"correctAnswer":"いがい","explanation":"Kanji `以外` dibaca 'igai' yang berarti selain/kecuali."},{"type":"Hiragana","question":"まどからずっと<span class='underline'>雲</span>を見ていました。","options":["ほし","ゆき","くも","そら"],"correctAnswer":"くも","explanation":"Kanji `雲` (くも) dibaca 'kumo' yang berarti awan."},{"type":"Hiragana","question":"その電車は<span class='underline'>急行</span>ですよ。","options":["きゅこ","きゅこう","きゅうこ","きゅうこう"],"correctAnswer":"きゅうこう","explanation":"Kanji `急行` dibaca 'kyuukou' yang berarti kereta ekspres (     const perTipe = {};
    soal.forEach(q => perTipe[q.type] = (perTipe[q.type]||0)+1);
    const terbaik = localStorage.getItem("n4r_terbaik_" + n);
    const kartu = document.createElement("div");
    kartu.className = "kartu-latihan";
    kartu.innerHTML =
      '<div class="nomor-besar">' + n + '</div>' +
      '<div class="isi-latihan">' +
        '<h2>Latihan ' + n + '</h2>' +
        '<div class="meta">Soal Ujian Tahun ' + TAHUN[n] + ' · ' + soal.length + ' soal</div>' +
        '<div class="chip-baris">' +
          Object.keys(perTipe).map(t => '<span class="chip">' + namaTipe(t) + ' <b>' + perTipe[t] + '</b></span>').join("") +
        '</div>' +
        (terbaik !== null ? '<div class="terbaik">Skor terbaik: <span class="lencana">' + terbaik + '%</span></div>' : '') +
        '<button class="btn btn-blok" data-mulai="' + n + '">Mulai Latihan →</button>' +
      '</div>';
    wadah.appendChild(kartu);
  });
  wadah.querySelectorAll("[data-mulai]").forEach(b =>
    b.addEventListener("click", () => mulaiLatihan(Number(b.dataset.mulai), BANK[b.dataset.mulai])));
}

/* ---------- Kuis ---------- */
function mulaiLatihan(nomor, daftarMentah){
  const daftar = daftarMentah.map(q => ({
    type: q.type, question: q.question, explanation: q.explanation,
    correctAnswer: q.correctAnswer, options: acak(q.options)
  }));
  sesi = { latihan: nomor, daftar, indeks: 0, benar: 0, salah: 0, riwayat: [] };
  tampil("layar-kuis");
  gambarSoal();
}

function gambarSoal(){
  const q = sesi.daftar[sesi.indeks];
  $("info-soal").textContent = "Soal " + (sesi.indeks+1) + " / " + sesi.daftar.length;
  $("skor-benar").textContent = sesi.benar;
  $("skor-salah").textContent = sesi.salah;
  $("bilah-progres").style.width = (sesi.indeks / sesi.daftar.length * 100) + "%";
  $("tipe-soal").textContent = namaTipe(q.type).toUpperCase();
  const teks = $("teks-soal");
  teks.innerHTML = q.question;
  teks.classList.toggle("panjang", q.question.replace(/<[^>]*>/g,"").length > 190);
  const wadah = $("wadah-opsi");
  wadah.innerHTML = "";
  q.options.forEach((opsi, i) => {
    const b = document.createElement("button");
    b.className = "opsi";
    b.innerHTML = '<span class="huruf">' + HURUF[i] + '</span><span>' + opsi + '</span>';
    b.addEventListener("click", () => jawab(b, q, opsi));
    wadah.appendChild(b);
  });
  $("kartu-bahas").classList.add("tersembunyi");
  $("btn-lanjut").classList.add("tersembunyi");
}

function jawab(tombol, q, dipilih){
  const benar = dipilih === q.correctAnswer;
  if (benar) sesi.benar++; else sesi.salah++;
  sesi.riwayat.push({ soal: q, dipilih, benar });
  $("skor-benar").textContent = sesi.benar;
  $("skor-salah").textContent = sesi.salah;
  document.querySelectorAll(".opsi").forEach(b => {
    b.disabled = true;
    const teksOpsi = b.querySelector("span:last-child").textContent;
    if (teksOpsi === q.correctAnswer) b.classList.add("benar");
    else if (b === tombol) b.classList.add("salah");
    else b.classList.add("redup");
  });
  $("label-bahas").textContent = benar ? "✓ BENAR!" : "✗ BELUM TEPAT — jawaban benar: " + q.correctAnswer;
  $("isi-bahas").innerHTML = q.explanation;
  $("kartu-bahas").classList.remove("tersembunyi");
  const lanjut = $("btn-lanjut");
  lanjut.textContent = sesi.indeks === sesi.daftar.length - 1 ? "Lihat Hasil →" : "Soal Berikutnya →";
  lanjut.classList.remove("tersembunyi");
  $("kartu-bahas").scrollIntoView({behavior:"smooth", block:"nearest"});
}

$("btn-lanjut").addEventListener("click", () => {
  if (sesi.indeks < sesi.daftar.length - 1) { sesi.indeks++; gambarSoal(); }
  else gambarHasil();
});
$("btn-menu-kuis").addEventListener("click", () => {
  if (confirm("Keluar dari latihan ini? Progres sesi ini hilang.")) { sesi = null; bangunMenu(); tampil("layar-menu"); }
});

/* ---------- Hasil ---------- */
function gambarHasil(){
  const total = sesi.daftar.length;
  const persen = Math.round(sesi.benar / total * 100);
  $("bilah-progres").style.width = "100%";
  const kunci = "n4r_terbaik_" + sesi.latihan;
  const lama = Number(localStorage.getItem(kunci) || -1);
  if (persen > lama) localStorage.setItem(kunci, String(persen));
  $("hasil-persen").textContent = persen + "%";
  $("hasil-rincian").textContent = "Benar " + sesi.benar + " dari " + total + " soal · Latihan " + sesi.latihan + " (Ujian " + TAHUN[sesi.latihan] + ")";
  $("hasil-pesan").textContent =
    persen >= 90 ? "Sugoi! Sudah sangat siap untuk N4." :
    persen >= 75 ? "Kerja bagus! Sedikit lagi menuju sempurna." :
    persen >= 60 ? "Lumayan! Ulas soal yang salah, lalu coba lagi." :
    persen >= 40 ? "Terus berlatih — ulasan di bawah adalah kuncinya." :
                   "Tidak apa-apa, semua mulai dari sini. Pelajari ulasannya ya.";
  const perTipe = {};
  sesi.riwayat.forEach(r => {
    perTipe[r.soal.type] = perTipe[r.soal.type] || { b:0, t:0 };
    perTipe[r.soal.type].t++;
    if (r.benar) perTipe[r.soal.type].b++;
  });
  $("hasil-kategori").innerHTML = Object.keys(perTipe).map(t => {
    const v = perTipe[t], p = Math.round(v.b / v.t * 100);
    return '<div class="baris-kat"><span class="nama">' + namaTipe(t) + '</span>' +
      '<span class="rel"><span class="isi-rel" style="display:block;width:' + p + '%"></span></span>' +
      '<span class="angka">' + v.b + '/' + v.t + '</span></div>';
  }).join("");
  const salahSaja = sesi.riwayat.filter(r => !r.benar);
  $("jumlah-salah").textContent = salahSaja.length;
  $("wadah-ulasan").style.display = salahSaja.length ? "" : "none";
  $("btn-ulangi-salah").style.display = salahSaja.length ? "" : "none";
  $("daftar-ulasan").innerHTML = salahSaja.map(r =>
    '<div class="ulasan"><div class="t jp">' + r.soal.question + '</div>' +
    '<div class="jwb">Jawabanmu: <span class="s jp">' + r.dipilih + '</span></div>' +
    '<div class="jwb">Jawaban benar: <span class="b jp">' + r.soal.correctAnswer + '</span></div>' +
    '<div class="bahas">' + r.soal.explanation + '</div></div>'
  ).join("");
  tampil("layar-hasil");
}

$("btn-ulangi").addEventListener("click", () => mulaiLatihan(sesi.latihan, BANK[sesi.latihan]));
$("btn-ulangi-salah").addEventListener("click", () => {
  const nomor = sesi.latihan;
  const daftar = sesi.riwayat.filter(r => !r.benar).map(r => r.soal);
  mulaiLatihan(nomor, daftar);
});
$("btn-menu-hasil").addEventListener("click", () => { sesi = null; bangunMenu(); tampil("layar-menu"); });

/* ---------- Mulai ---------- */
bangunMenu();
const param = new URLSearchParams(location.search).get("mulai");
if (param && BANK[param]) mulaiLatihan(Number(param), BANK[param]);
</script>
